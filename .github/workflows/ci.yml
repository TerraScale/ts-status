name: CI

# Every main push runs tests; existing external Cloudflare publication is unchanged.
"on":
  pull_request:
  push:
    branches: [main]
  schedule:
    # Recheck main and refresh its shared npm cache once a week.
    - cron: '47 1 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('.node-version', 'package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Audit dependencies on every change
        run: npm run audit:dependencies -- --package-lock-only
      - name: Check, test and build
        run: |
          npm ci
          npm run check
          npm test
          python3 -m unittest discover -s scripts -p 'test_*.py'
          npm run build
      - name: Save main npm cache
        if: github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
