name: CI

# One required check: "ci".

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: useblacksmith/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: useblacksmith/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run deploy
        env:
          VERSION: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # A healthy older Worker must not pass: production has to serve this commit.
      - name: Smoke check production
        run: |
          for attempt in $(seq 1 30); do
            version=$(curl -fsS https://status.terrascale.tech/health/version | jq -r .version || true)
            if [ "$version" = "$GITHUB_SHA" ]; then
              curl -fsS -o /dev/null https://status.terrascale.tech/api/v1/status
              exit 0
            fi
            sleep 10
          done
          echo "status.terrascale.tech serves ${version:-nothing}, expected $GITHUB_SHA" >&2
          exit 1
