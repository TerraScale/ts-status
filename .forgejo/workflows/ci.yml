name: ts-status CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Verify ts-status
    runs-on: terrascale-builder
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false

      # npm 11 blocks dependency install scripts unless a project allowScripts
      # policy names each native helper. Keep installation deterministic and
      # prepare only the two native helpers used by this lockfile explicitly.
      - name: Install locked dependencies
        shell: bash
        run: npm ci --ignore-scripts

      - name: Prepare the locked native helpers
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/esbuild/install.js
          node node_modules/workerd/install.js

      # Tasks run through the vite-plus runner (vpr) instead of npm scripts.
      - name: Type-check the application
        shell: bash
        run: vpr check

      - name: Run the unit tests
        shell: bash
        run: vpr test

      - name: Build the Worker bundle
        shell: bash
        run: vpr build

      # This validates the generated deployment plan only. It never applies D1
      # migrations and never publishes to Cloudflare.
      - name: Validate the Wrangler deployment plan
        shell: bash
        run: npm exec -- wrangler deploy --config dist/server/wrangler.json --dry-run
