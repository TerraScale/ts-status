name: ts-status CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Verify ts-status
    runs-on: terrascale-builder
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      # No dependency needs its install script: the Vite build, the tests and
      # the Wrangler dry run all use prebuilt platform packages.
      - name: Install locked dependencies
        shell: bash
        run: npm ci --ignore-scripts

      # Run the locked toolchain, not the runner's global vite-plus install,
      # whose native binding can drift from the image.
      - name: Use the locked toolchain
        shell: bash
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # Tasks run through the vite-plus runner (vpr) instead of npm scripts.
      - name: Type-check the application
        shell: bash
        run: vpr check

      - name: Lint the sources
        shell: bash
        run: vpr lint

      - name: Run the unit tests
        shell: bash
        run: vpr test

      - name: Build the Worker bundle
        shell: bash
        run: vpr build

      # This validates the generated deployment plan only. It never applies D1
      # migrations and never publishes to Cloudflare.
      - name: Validate the Wrangler deployment plan
        shell: bash
        run: npm exec -- wrangler deploy --dry-run
