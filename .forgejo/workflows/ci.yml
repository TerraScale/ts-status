name: ts-status CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ts-status-${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify ts-status
    runs-on: terrascale-builder
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: "https://git.terrascale.tech"
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false

      # No dependency needs its install script: the Vite build, the tests and
      # the Wrangler dry run all use prebuilt platform packages.
      - name: Install locked dependencies
        shell: bash
        run: npm ci --ignore-scripts

      # Run the locked toolchain, not the runner's global vite-plus install,
      # whose native binding can drift from the image.
      - name: Use the locked toolchain
        shell: bash
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # Tasks run through the vite-plus runner (vpr) instead of npm scripts.
      # They are independent (the build writes only the ignored dist/ and
      # .wrangler/), so they run concurrently; each one's output is grouped.
      - name: Type-check, lint, test and build the Worker bundle
        shell: bash
        env:
          FORGEJO_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: .forgejo/scripts/parallel.sh "vpr check" "vpr lint" "vpr test" "vpr build"

      # This validates the generated deployment plans of the status Worker
      # and its vantage Workers only. It never applies D1 migrations and
      # never publishes to Cloudflare.
      - name: Validate the Wrangler deployment plans
        shell: bash
        run: |
          plans=("wrangler deploy --dry-run")
          for config in dist/ts_status_vantage_*/wrangler.json; do
            plans+=("wrangler deploy --dry-run -c $config")
          done
          .forgejo/scripts/parallel.sh "${plans[@]}"

      # Deployment failure must not erase the time this build became qualified.
      - name: Record the qualified main build for the deployment-lag guard
        if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main'
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 30 -o /dev/null \
            -H "Authorization: token ${FORGEJO_TOKEN}" -H 'Content-Type: application/json' \
            --data '{"state":"success","context":"deployment/qualified","description":"Verified main build ready for automatic deployment"}' \
            "https://git.terrascale.tech/api/v1/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
      # A merged push ships what verification just approved: the build above
      # left dist/ populated, so the exact verified bundles are deployed.
      # Pull requests never take this step. Migrations go first, so the new
      # code never reads a schema it does not know; then the vantage Workers
      # the status Worker binds to, then the status Worker itself.
      - name: Apply D1 migrations and deploy to Cloudflare
        if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT: ${{ forgejo.sha }}
        run: |
          set -euo pipefail
          # Fail closed: a missing credential must never let a main push
          # report green without deploying.
          : "${CLOUDFLARE_API_TOKEN:?deploy: CLOUDFLARE_API_TOKEN is required}"
          : "${CLOUDFLARE_ACCOUNT_ID:?deploy: CLOUDFLARE_ACCOUNT_ID is required}"
          wrangler d1 migrations apply ts-status-db --remote
          # The commit marks each version: wrangler deployments list shows it.
          for config in dist/ts_status_vantage_*/wrangler.json; do
            wrangler deploy -c "$config" --tag "${COMMIT:0:12}" --message "$COMMIT" --var "VERSION:${COMMIT}"
          done
          wrangler deploy --tag "${COMMIT:0:12}" --message "$COMMIT" --var "VERSION:${COMMIT}"

      - name: Smoke check the production status page
        if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -eu
          for attempt in 1 2 3 4 5 6; do
            if revision=$(curl -fsS --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' \
              https://status.terrascale.tech/health/version | jq -er '.version') \
              && [[ $revision == "$GITHUB_SHA" ]]; then
              curl -fsS --connect-timeout 10 --max-time 20 -o /dev/null https://status.terrascale.tech/api/v1/status
              echo "deploy: https://status.terrascale.tech serves $revision"
              exit 0
            fi
            echo "deploy: waiting for the status page (attempt ${attempt}/6)" >&2
            sleep 10
          done
          echo "deploy: https://status.terrascale.tech is not answering" >&2
          exit 1
